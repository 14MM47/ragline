name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The lockfile is the tested set; --locked fails if pyproject drifted from it.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ocr

      - name: Lint (ruff)
        run: uv run ruff check .

      # Unit tests stub every model client: no Qdrant, no endpoints, no GPU.
      - name: Unit tests
        run: uv run pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
