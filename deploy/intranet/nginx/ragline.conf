# nginx site for ragline — TLS termination + reverse proxy to uvicorn.
#
# Install: copy to /etc/nginx/sites-available/ragline, symlink into
# sites-enabled, place the internal-CA cert/key at the paths below,
# `nginx -t && systemctl reload nginx`.
#
# Replace ragline.corp.example with the real internal DNS name.

# Plain HTTP exists only to redirect. Nothing is served over it: the session
# cookie is Secure-flagged, the Entra redirect URI is https, and
# navigator.clipboard (the copy-network-path button) needs a secure context.
server {
    listen 80;
    listen [::]:80;
    server_name ragline.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragline.corp.example;

    # Internal-CA issued certificate (calendar the expiry — see the
    # secret-rotation runbook in deploy/intranet/RUNBOOK.md).
    ssl_certificate     /etc/ssl/ragline/ragline.crt;
    ssl_certificate_key /etc/ssl/ragline/ragline.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hardening headers.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The SPA is fully same-origin (no CDN, no external assets); Vite emits
    # hashed JS/CSS files, no inline scripts, and Tailwind's CSS is extracted
    # to a file at build time, so style-src needs no 'unsafe-inline' (React
    # style={} props go through CSSOM, which CSP does not block). data: images
    # cover favicons. frame-ancestors 'none': no other site (including
    # intranet siblings) may embed ragline in an iframe (clickjacking).
    # base-uri/object-src/form-action close the remaining injection-pivot
    # vectors.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;

    # Batch upload allows up to 1000 files (BATCH_MAX_FILES) in one request.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the append variant
        # preserves whatever X-Forwarded-For the client sent, making the
        # header spoofable if it's ever used for rate limiting or audit logs.
        # nginx is the first proxy here, so the real client IP is authoritative.
        proxy_set_header X-Forwarded-For $remote_addr;

        # SSE-critical: /api/chat streams the answer as server-sent events on a
        # POST. Buffering here turns incremental streaming into one big flush
        # at the end — the app looks broken while the LLM generates.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
